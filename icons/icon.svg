<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Snap Bubbles">
  <defs>
    <radialGradient id="bubble" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfe7ff"/>
      <stop offset="60%" stop-color="#3aa9f0"/>
      <stop offset="100%" stop-color="#1d5891"/>
    </radialGradient>
    <radialGradient id="highlight" cx="32%" cy="28%" r="22%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="68%" cy="72%" r="32%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="#0d1117"/>
  <circle cx="256" cy="266" r="178" fill="#2f81f7" opacity="0.35" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="178" fill="url(#bubble)"/>
  <circle cx="256" cy="256" r="178" fill="url(#shadow)"/>
  <circle cx="256" cy="256" r="178" fill="url(#highlight)"/>
</svg>
