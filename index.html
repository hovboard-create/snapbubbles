<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta name="theme-color" content="#0d1117" />
  <title>Snap Bubbles — Virtual Bubble Wrap Game (Free, Online)</title>
  <meta name="description" content="Free virtual bubble wrap online. Pop bubbles to relax in Zen mode, race the clock in Speed mode, or beat the countdown in Survival mode. No download, plays in your browser." />
  <link rel="canonical" href="https://snapbubbles.com/" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Snap Bubbles" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://snapbubbles.com/" />
  <meta property="og:title" content="Snap Bubbles — Virtual Bubble Wrap Game" />
  <meta property="og:description" content="Pop virtual bubble wrap online. Zen, Speed, or Survival mode. Free, no install." />
  <meta property="og:image" content="https://snapbubbles.com/icons/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Snap Bubbles" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://snapbubbles.com/" />
  <meta name="twitter:title" content="Snap Bubbles — Virtual Bubble Wrap Game" />
  <meta name="twitter:description" content="Pop virtual bubble wrap online. Three modes. Free, no install." />
  <meta name="twitter:image" content="https://snapbubbles.com/icons/og-image.png" />

  <!-- JSON-LD: VideoGame schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Snap Bubbles",
    "url": "https://snapbubbles.com/",
    "description": "Free online virtual bubble wrap. Three modes: Zen, Speed, Survival.",
    "image": "https://snapbubbles.com/icons/og-image.png",
    "genre": ["Casual", "Puzzle", "Arcade"],
    "applicationCategory": "Game",
    "operatingSystem": "Web Browser",
    "isAccessibleForFree": true,
    "playMode": "SinglePlayer",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "publisher": {
      "@type": "Organization",
      "name": "Snap Bubbles"
    }
  }
  </script>

  <!-- GA4: replace G-XXXXXXXXXX with measurement ID once provisioned -->
  <!-- <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script> -->
  <!-- <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-XXXXXXXXXX');</script> -->

  <!-- AdSense: account ca-pub-6647695511145371 -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6647695511145371" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Mobile-only top banner ad (forced 320x50 banner) -->
  <div class="ad-slot ad-slot-mobile-top" aria-hidden="true">
    <ins class="adsbygoogle"
         style="display:inline-block; width:320px; height:50px;"
         data-ad-client="ca-pub-6647695511145371"
         data-ad-slot="5593540392"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">Snap Bubbles</span>
    </div>
    <div class="modes" role="tablist" aria-label="Game mode">
      <button class="mode-btn is-active" data-mode="zen" role="tab" aria-selected="true">Zen</button>
      <button class="mode-btn" data-mode="speed" role="tab" aria-selected="false">Speed</button>
      <button class="mode-btn" data-mode="survival" role="tab" aria-selected="false">Survival</button>
    </div>
  </header>

  <section class="stats" aria-live="polite">
    <div class="stat" data-stat="popped"><span class="stat-label">Popped</span><span class="stat-value" id="popped">0</span></div>
    <div class="stat" data-stat="timer" hidden><span class="stat-label">Time</span><span class="stat-value" id="timer">0.00s</span></div>
    <div class="stat" data-stat="target" hidden><span class="stat-label">Target</span><span class="stat-value" id="target">50</span></div>
    <div class="stat" data-stat="best" hidden><span class="stat-label">Best</span><span class="stat-value" id="best">—</span></div>
    <div class="stat" data-stat="level" hidden><span class="stat-label">Level</span><span class="stat-value" id="level">1</span></div>
    <div class="stat" data-stat="score" hidden><span class="stat-label">Score</span><span class="stat-value" id="score">0</span></div>
  </section>

  <div id="countdown" class="countdown" hidden aria-hidden="true">
    <div class="countdown-fill"></div>
    <div class="countdown-text"><span id="countdown-seconds">30.0</span>s</div>
  </div>

  <main class="game">
    <div id="grid" class="grid" aria-label="Bubble wrap"></div>

    <div id="overlay" class="overlay" hidden>
      <div class="overlay-card">
        <h2 id="overlay-title">Nice!</h2>
        <p id="overlay-body">You popped 50 bubbles in 8.42s.</p>
        <div class="overlay-actions">
          <button id="overlay-again" class="btn btn-primary">Play Again</button>
        </div>
      </div>
    </div>

    <div id="level-toast" class="level-toast" hidden></div>
    <div id="mode-toast" class="mode-toast" hidden></div>
  </main>

  <footer class="bottombar">
    <a class="footer-link" href="/how-to-play.html">How to Play</a>
    <button id="new-sheet" class="btn btn-ghost" aria-label="New sheet of bubbles">New Sheet</button>
    <div class="ad-slot ad-slot-desktop-bottom" aria-hidden="true">
      <!-- Desktop-only bottom ad — auto format -->
      <ins class="adsbygoogle"
           style="display:block; width:100%; height:100%;"
           data-ad-client="ca-pub-6647695511145371"
           data-ad-slot="4280458729"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </footer>

  <script src="game.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
